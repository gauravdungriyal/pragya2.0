<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Pragya Yog School — AI Assistant</title>
  <link rel="icon" type="image/png" href="logo.png">
  <!-- Roboto — the exact body font used on pyshk.com, so the widget matches the live site. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <script src="js/embed-detect.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="demo-wrap">
    <div class="chat-shell">
      <div class="chat-header">
        <div class="chat-avatar"><img src="mascot.png" alt="Pragya"></div>
        <div class="chat-header-info">
          <h3>Pragya</h3>
          <div class="status"><span class="pulse"></span>Online · Powered by pyshk</div>
        </div>
        <div class="lang-picker">
          <button class="lang-btn" id="langBtn" type="button" data-action="toggleLangMenu" aria-haspopup="true" aria-expanded="false" title="Language" aria-label="Choose language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9s1.3-6.5 3.8-9z"></path></svg>
            <span id="langCurrent">EN</span>
          </button>
          <div class="lang-menu" id="langMenu" role="menu" hidden>
            <button class="lang-opt" type="button" data-action="setLang" data-arg="auto" role="menuitemradio" aria-checked="true">🌐 Auto-detect <small>reply in the language you use</small></button>
            <button class="lang-opt" type="button" data-action="setLang" data-arg="en" role="menuitemradio" aria-checked="false">English</button>
            <button class="lang-opt" type="button" data-action="setLang" data-arg="yue" role="menuitemradio" aria-checked="false"><b>廣東話</b> Cantonese</button>
            <button class="lang-opt" type="button" data-action="setLang" data-arg="cmn" role="menuitemradio" aria-checked="false"><b>普通话</b> Mandarin</button>
          </div>
        </div>
        <a class="wa-btn" href="https://wa.me/85267082503?text=Namaste%20%F0%9F%99%8F%20I%20have%20a%20question%20about%20Pragya%20Yog%20School" target="_blank" rel="noopener" title="Chat with us on WhatsApp" aria-label="Chat with us on WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </a>
        <button class="reset-btn" data-action="resetChat" title="New conversation">↻</button>
      </div>

      <div class="offline-bar" id="offlineBar">📡 You're offline — messages will send when you're back online.</div>

      <div class="chat-body" id="chatBody" aria-live="polite" aria-label="Chat conversation"></div>

      <button class="scroll-down-btn" id="scrollDownBtn" data-action="scrollDown" title="Jump to latest" aria-label="Scroll to latest message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>

      <div class="chat-footer">
        <div class="chat-input-row">
          <button class="voice-btn" id="voiceBtn" title="Speak your question" aria-label="Speak your question">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="11" rx="3"></rect>
              <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </button>
          <textarea class="chat-input" id="chatInput" placeholder="Ask me anything" rows="1" aria-label="Type your message"></textarea>
          <button class="voice-live-btn" id="voiceLiveBtn" type="button" data-action="openVoiceMode" title="Live voice chat" aria-label="Start a live voice conversation">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="10" x2="4" y2="14"></line>
              <line x1="8" y1="7" x2="8" y2="17"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
              <line x1="16" y1="7" x2="16" y2="17"></line>
              <line x1="20" y1="10" x2="20" y2="14"></line>
            </svg>
          </button>
          <button class="send-btn" id="sendBtn" type="button" data-action="sendMessage" title="Send message" aria-label="Send message">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
