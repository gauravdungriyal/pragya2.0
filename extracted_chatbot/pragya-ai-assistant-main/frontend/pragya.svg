<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pragya">
  <defs>
    <radialGradient id="pgBg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FFD866"/>
      <stop offset="62%" stop-color="#FBB534"/>
      <stop offset="100%" stop-color="#F59E1B"/>
    </radialGradient>
    <clipPath id="pgClip"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>

  <!-- Yellow background -->
  <circle cx="60" cy="60" r="60" fill="url(#pgBg)"/>

  <g clip-path="url(#pgClip)">
    <!-- floor shadow -->
    <ellipse cx="60" cy="116" rx="27" ry="4.5" fill="#B5760F" opacity="0.28"/>

    <!-- feet -->
    <ellipse cx="54" cy="113" rx="5" ry="3" fill="#E9AE7C"/>
    <ellipse cx="66" cy="113" rx="5" ry="3" fill="#E9AE7C"/>

    <!-- Saree skirt (A-line, flares to the hem) -->
    <path d="M60 60 C50 60 45 66 42 82 C39 98 35 108 33 112 L87 112 C85 108 81 98 78 82 C75 66 70 60 60 60 Z" fill="#FFD84D"/>
    <!-- soft pleat lines -->
    <path d="M60 66 L60 111" stroke="#F3BE2E" stroke-width="1.4" fill="none"/>
    <path d="M52 70 C50 86 47 100 45 111" stroke="#F3BE2E" stroke-width="1.1" fill="none"/>
    <path d="M68 70 C70 86 73 100 75 111" stroke="#F3BE2E" stroke-width="1.1" fill="none"/>
    <!-- decorative hem border -->
    <path d="M33 112 L87 112 L86 108 C70 111 50 111 34 108 Z" fill="#E8912A"/>
    <path d="M34.5 109.5 C50 112 70 112 85.5 109.5" stroke="#D6323B" stroke-width="1.4" fill="none" opacity="0.75"/>

    <!-- Blouse (choli) torso -->
    <path d="M60 55 C52 55 47 59 46 66 C52 70 68 70 74 66 C73 59 68 55 60 55 Z" fill="#EE9E2C"/>
    <!-- waist -->
    <rect x="50" y="63" width="20" height="6" rx="3" fill="#E8912A"/>

    <!-- Pallu draped over the left shoulder and down -->
    <path d="M50 50 C44 54 41 64 42 78 C46 74 49 66 52 60 C54 56 55 53 55 51 Z" fill="#F4A62A" opacity="0.95"/>

    <!-- Arms bent in to the chest (namaste) -->
    <path d="M49 52 C43 55 41 62 46 66 L54 60 C52 56 51 53 49 52 Z" fill="#EFC09A"/>
    <path d="M71 52 C77 55 79 62 74 66 L66 60 C68 56 69 53 71 52 Z" fill="#EFC09A"/>

    <!-- Neck -->
    <rect x="55.5" y="38" width="9" height="10" rx="4" fill="#E9AE7C"/>
    <path d="M55.5 45 C58 49 62 49 64.5 45 L64.5 49 L55.5 49 Z" fill="#D89A66"/>

    <!-- Hair behind head -->
    <path d="M42 30 C40 14 52 6 60 6 C68 6 80 14 78 30 C78 38 74 43 71 45 C74 33 72 22 60 22 C48 22 46 33 49 45 C46 43 42 38 42 30 Z" fill="#2C2438"/>
    <circle cx="60" cy="8" r="6" fill="#2C2438"/>

    <!-- Head -->
    <circle cx="60" cy="28" r="14" fill="#F0C29A"/>
    <!-- hair fringe -->
    <path d="M46 28 C46 16 53 11 60 11 C67 11 74 16 74 28 C70 21 66 18 60 18 C54 18 50 21 46 28 Z" fill="#2C2438"/>

    <!-- ears + earrings -->
    <circle cx="46" cy="29" r="2.6" fill="#F0C29A"/>
    <circle cx="74" cy="29" r="2.6" fill="#F0C29A"/>
    <circle cx="46" cy="33" r="1.6" fill="#E8912A"/>
    <circle cx="74" cy="33" r="1.6" fill="#E8912A"/>

    <!-- bindi -->
    <circle cx="60" cy="22.5" r="1.5" fill="#D6323B"/>

    <!-- eyebrows -->
    <path d="M52 25 Q55.5 22.5 59 25" stroke="#3a2f47" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M61 25 Q64.5 22.5 68 25" stroke="#3a2f47" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="54.5" cy="29.5" rx="3.4" ry="4" fill="#ffffff"/>
    <ellipse cx="65.5" cy="29.5" rx="3.4" ry="4" fill="#ffffff"/>
    <g>
      <circle cx="54.5" cy="30" r="1.7" fill="#2b2233"/>
      <circle cx="65.5" cy="30" r="1.7" fill="#2b2233"/>
      <circle cx="55.1" cy="29.3" r="0.5" fill="#fff"/>
      <circle cx="66.1" cy="29.3" r="0.5" fill="#fff"/>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="0,0; 1.5,0; 1.5,0; -1.5,0; -1.5,0; 0,0"
        keyTimes="0; 0.18; 0.4; 0.58; 0.8; 1" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- nose + smile + cheeks -->
    <path d="M60 30 L58.6 34 Q60 35 61.4 34 Z" fill="#E1A579"/>
    <path d="M56 36.5 Q60 39.5 64 36.5" stroke="#B5544B" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <circle cx="51" cy="33.5" r="2.2" fill="#F2A98C" opacity="0.5"/>
    <circle cx="69" cy="33.5" r="2.2" fill="#F2A98C" opacity="0.5"/>

    <!-- NAMASTE hands at the chest — palms gently part and rejoin -->
    <g transform="translate(0,0)">
      <!-- left palm -->
      <g>
        <path d="M60 47 C56.5 49 54 54 53.5 59 C53 63 55 65 60 65 Z" fill="#EDB98B"/>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          values="0,0; 0,0; -3,0.4; -3,0.4; 0,0; 0,0"
          keyTimes="0; 0.32; 0.46; 0.6; 0.74; 1" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <!-- right palm -->
      <g>
        <path d="M60 47 C63.5 49 66 54 66.5 59 C67 63 65 65 60 65 Z" fill="#EDB98B"/>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          values="0,0; 0,0; 3,0.4; 3,0.4; 0,0; 0,0"
          keyTimes="0; 0.32; 0.46; 0.6; 0.74; 1" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <!-- seam between palms -->
      <path d="M60 48 L60 64" stroke="#D89A66" stroke-width="1" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.32;0.46;0.6;0.74;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <!-- wrist bangles -->
      <rect x="53.5" y="62.5" width="13" height="3.2" rx="1.6" fill="#E8912A"/>
    </g>
  </g>

  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#E8912A" stroke-opacity="0.35" stroke-width="2"/>
</svg>
